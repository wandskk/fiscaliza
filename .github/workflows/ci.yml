name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Repository, /health and e2e tests run against a real Postgres, like the docker compose
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: fiscaliza
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: fiscaliza
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fiscaliza -d fiscaliza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fiscaliza:dev@localhost:5432/fiscaliza
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @fiscaliza/api db:deploy
      - run: pnpm test
