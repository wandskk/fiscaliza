name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Repository, /health and e2e tests run against a real Postgres, like the docker compose; the Vitest global setup creates and migrates the fiscaliza_test database on it
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: fiscaliza
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: fiscaliza
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fiscaliza -d fiscaliza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Started here, not in services: the init script that creates the bucket comes from the checkout
      - name: Start LocalStack
        run: |
          docker run -d --name aws -p 4566:4566 -e SERVICES=s3,sqs -e AWS_DEFAULT_REGION=us-east-1 \
            -v "$PWD/infra/localstack:/etc/localstack/init/ready.d" localstack/localstack:3.8
          for i in $(seq 1 60); do
            curl -sf localhost:4566/_localstack/init/ready | grep -q '"completed": *true' && exit 0
            sleep 2
          done
          docker logs aws
          exit 1

      - run: pnpm test
