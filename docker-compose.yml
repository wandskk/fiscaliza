services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fiscaliza
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: fiscaliza
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiscaliza -d fiscaliza']
      interval: 5s
      timeout: 5s
      retries: 10

  aws:
    # Pinned: init scripts depend on the LocalStack CLI behaviour of this version
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,sqs,ses
      AWS_DEFAULT_REGION: us-east-1
    ports: ['4566:4566']
    volumes: ['./infra/localstack:/etc/localstack/init/ready.d']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf localhost:4566/_localstack/init/ready | grep -q ''"completed": *true''',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Optional: the variables below are enough to run, the .env only adds others
    env_file:
      - path: apps/api/.env
        required: false
    # Take precedence over the .env: inside the compose network the hosts are db and aws
    environment:
      # The image is built for production; locally the compose runs it with the test users
      NODE_ENV: development
      DATABASE_URL: postgresql://fiscaliza:dev@db:5432/fiscaliza
      AWS_ENDPOINT: http://aws:4566
      AWS_PUBLIC_ENDPOINT: http://localhost:4566
      INSPECTIONS_QUEUE_URL: http://aws:4566/000000000000/fiscaliza-inspections
    ports: ['3000:3000']
    depends_on:
      db:
        condition: service_healthy
      aws:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; Node's fetch does the same job
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    # Optional: the variables below are enough to run, the .env only adds others (e.g. the keys)
    env_file:
      - path: apps/worker/.env
        required: false
    # Take precedence over the .env: inside the compose network the hosts are db and aws
    environment:
      # The image is built for production, which refuses the stub; locally the compose runs it as development
      NODE_ENV: development
      DATABASE_URL: postgresql://fiscaliza:dev@db:5432/fiscaliza
      AWS_ENDPOINT: http://aws:4566
      INSPECTIONS_QUEUE_URL: http://aws:4566/000000000000/fiscaliza-inspections
      # LLM_PROVIDERS is left out on purpose: it defaults to stub (offline, deterministic), and
      # apps/worker/.env switches it, e.g. gemini,fallback with the keys
    depends_on:
      db:
        condition: service_healthy
      aws:
        condition: service_healthy

volumes:
  pgdata: {}
