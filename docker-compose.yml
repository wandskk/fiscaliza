services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fiscaliza
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: fiscaliza
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiscaliza -d fiscaliza']
      interval: 5s
      timeout: 5s
      retries: 10

  aws:
    # Pinned: init scripts depend on the LocalStack CLI behaviour of this version
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
    ports: ['4566:4566']
    volumes: ['./infra/localstack:/etc/localstack/init/ready.d']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf localhost:4566/_localstack/init/ready | grep -q ''"completed": *true''',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata: {}
